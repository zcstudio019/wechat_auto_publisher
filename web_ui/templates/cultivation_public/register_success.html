<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>{{ '档案已更新' if is_update else '档案已建立' }}</title><style>body{margin:0;background:#f4f7fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.box{max-width:520px;margin:8vh auto;padding:24px}.card{background:#fff;border-radius:18px;padding:34px 24px;box-shadow:0 10px 30px rgba(31,41,55,.08);text-align:center}.icon{font-size:48px}.hint{color:#6b7280;line-height:1.8}.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;background:#1677ff;color:#fff;font-size:17px;padding:14px;margin-top:24px}</style></head><body><main class="box"><section class="card"><div class="icon">✅</div><h1>{{ '档案已更新' if is_update else '档案已建立' }}</h1><p class="hint">您的融资档案已成功{{ '更新' if is_update else '建立' }}。<br>后续我们会根据您的贷款到期时间、征信、流水和负债情况，为您提供针对性的融资提醒。</p><p class="hint">如需立即咨询，可回到公众号回复：<strong>“咨询”</strong></p><button class="btn" type="button" onclick="closeWechat()">返回公众号</button></section></main><script>function closeWechat(){if(window.WeixinJSBridge){WeixinJSBridge.call('closeWindow')}else{history.back()}}</script></body></html>
